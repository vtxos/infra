# A release: the enclave image (with its PCR0) and MerlinPlatform, built here from public sources
# so anyone can rebuild them and compare, and the cosigner as vtxos/cosigner released it.
# deploy.sh <tag> ships one.
#
# The cosigner is released bare. Its MutinyNet settings, one of them the Grid view token, are
# written into it at deploy time, and PCR16 is measured then.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  eif:
    name: enclave image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: nix build .#eif
        run: |
          nix build .#eif -L --out-link result
          mkdir -p out && cp result/enclave.eif out/enclave.eif && cp result/pcr.json out/
          jq -r '"PCR0 \(.PCR0)"' out/pcr.json
      # The parent's end of the vsock, static: the parent is stock Amazon Linux, no Nix.
      - name: nix build .#gvproxy
        run: |
          nix build .#gvproxy -L --out-link gvproxy
          cp gvproxy/bin/gvproxy out/
      - uses: actions/upload-artifact@v4
        with: { name: eif, path: out/ }

  # Not built here: vtxos/cosigner releases it, and this takes those exact bytes, refused unless
  # they match pins.env. The same file the dev enclave image and enclave-runtime's CI serve.
  cosigner:
    name: cosigner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the pinned release
        run: |
          . ./pins.env
          mkdir -p out
          curl -fL --retry 3 --retry-all-errors -o out/cosigner.wasm \
            "https://github.com/vtxos/cosigner/releases/download/$COSIGNER_RELEASE/cosigner.wasm"
          echo "$COSIGNER_SHA256  out/cosigner.wasm" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with: { name: cosigner, path: out/ }

  platform:
    name: MerlinPlatform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MerlinPlatform at the pinned commit, on the same cosigner release
        run: |
          . ./pins.env
          git clone --quiet https://github.com/vtxos/platform mp
          git -C mp checkout --quiet "$MERLINPLATFORM_REV"
          pinned="$(grep -o 'vtxos/cosigner", tag = "[^"]*' mp/Cargo.toml | cut -d'"' -f3 | sort -u)"
          [ "$pinned" = "$COSIGNER_RELEASE" ] || {
            echo "MerlinPlatform builds against cosigner ${pinned:-(none)}, the release is $COSIGNER_RELEASE" >&2
            exit 1
          }
      # Static, so it runs on the parent's Amazon Linux whatever its glibc. rustls and ring, no
      # OpenSSL; musl-gcc builds ring's and secp256k1's C.
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - name: build
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler musl-tools
          cd mp
          cargo build --locked --release --target x86_64-unknown-linux-musl --bin merlin-platform
          mkdir -p ../out && cp target/x86_64-unknown-linux-musl/release/merlin-platform ../out/
          file ../out/merlin-platform
      - uses: actions/upload-artifact@v4
        with: { name: platform, path: out/ }

  release:
    needs: [eif, cosigner, platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./pins.env
          runtime_rev="$(jq -r '.nodes["enclave-runtime"].locked.rev' flake.lock)"
          cd dist && sha256sum * > SHA256SUMS
          {
            echo "PCR0 \`$(jq -r .PCR0 pcr.json)\`"
            echo
            echo "- enclave-runtime: \`$runtime_rev\` (flake.lock)"
            echo "- cosigner: \`$COSIGNER_RELEASE\` (sha256 \`$COSIGNER_SHA256\`)"
            echo "- MerlinPlatform: \`$MERLINPLATFORM_REV\`"
            echo
            echo 'Rebuild the image: `nix build github:vtxos/infra/${{ github.ref_name }}#eif && jq -r .PCR0 result/pcr.json`'
          } > ../notes.md
          gh release create "${{ github.ref_name }}" --notes-file ../notes.md *
