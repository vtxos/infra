# The dev enclave image (dev-enclave/): enclave-runtime's QEMU bundle and the released cosigner,
# both as pins.env pins them, for a wallet's e2e to run from compose. Booted here before it is
# pushed, so an image that cannot serve never gets a digest anybody pins.
name: Dev enclave image

on:
  push:
    branches: [main]
    paths: [pins.env, "dev-enclave/**", .github/workflows/dev-enclave-image.yml]
  pull_request:
    paths: [pins.env, "dev-enclave/**", .github/workflows/dev-enclave-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dev-enclave/build.sh dev-enclave:candidate
      # What enclave-runtime's CI does on the same runners: /dev/kvm exists but is root-owned, and
      # the harness forwards the enclave's vsock to host loopback.
      - name: Let the runner open KVM, and load the vsock loopback transport
        run: |
          if [ -e /dev/kvm ] && [ ! -r /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          [ -e /dev/vsock ] || sudo modprobe vsock_loopback
      - name: Boot it, as compose.yml runs it
        env:
          DEV_ENCLAVE_IMAGE: dev-enclave:candidate
        run: |
          export ENCLAVE_DIR="$RUNNER_TEMP/enclave"
          mkdir -p "$ENCLAVE_DIR"
          docker compose -f dev-enclave/compose.yml up -d --wait --wait-timeout 1500 \
            || { docker compose -f dev-enclave/compose.yml logs --tail 80; exit 1; }
          docker compose -f dev-enclave/compose.yml down
          [ -z "$(docker ps -q --filter label=enclave-harness=vtxos)" ] \
            || { echo "down left the harness's containers running" >&2; exit 1; }
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          . ./pins.env
          runtime="$(docker inspect -f '{{ index .Config.Labels "org.vtxos.runtime" }}' dev-enclave:candidate)"
          image="ghcr.io/vtxos/dev-enclave:cosigner-$COSIGNER_RELEASE-runtime-$runtime"
          docker tag dev-enclave:candidate "$image"
          docker push "$image"
          digest="$(docker inspect -f '{{ index .RepoDigests 0 }}' "$image")"
          echo "pin: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$digest"
